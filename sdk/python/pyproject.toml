[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debugscope"
version = "0.1.0"
description = "Tiny non-blocking UDP telemetry SDK for DebugScope"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DebugScope contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["debugscope*"]
